name: pages

# Builds the documentation site in `site/` and deploys it to GitHub Pages.
#
# Kept out of tests.yml deliberately: that workflow is the gate on whether the
# package works, and a docs deployment must never be able to hold up — or be
# mistaken for — a passing test run.
#
# The pull-request job builds without deploying. The site build verifies its
# own output (every internal link and every in-page anchor has to resolve), so
# this is a cheap way to catch a cross-reference that rotted when a heading was
# reworded, which is invisible in a diff and obvious to a reader.
#
# ONE-TIME SETUP, and the first thing to check when a run fails:
#   repository Settings → Pages → Source: "GitHub Actions"
#
# Without it the build succeeds, the artifact uploads, and the deploy step ends
# in `HttpError: Not Found` — a 404 from the deployment API, because there is
# no Pages site to deploy to. Nothing in this file can detect that; the setting
# has to be made in the repository.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Never cancel a deployment in progress: a half-published site is worse than a
# slightly stale one. Queued runs simply wait their turn.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    name: Build the docs site

    steps:
      - uses: actions/checkout@v5

      # v5 of both actions declares the node24 runtime. v4 declares node20,
      # which GitHub is retiring from the runners — see
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # No install step. The builder uses nothing but Node built-ins, which is
      # what keeps this job to a couple of seconds and stops the site from
      # breaking one day because a transitive dependency published a major.
      - name: Build
        run: node site/build.mjs
        env:
          # A project site lives at /<repo>/, so every absolute URL has to
          # carry that prefix or the stylesheet 404s and the nav goes nowhere.
          SITE_BASE: /${{ github.event.repository.name }}/
          SITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      # Deliberately still v3. v4 excludes dotfiles from the artifact, and the
      # build writes a .nojekyll; v4 is a composite action, so it is not one of
      # the ones producing the node20 notice anyway. Nothing to gain, something
      # to lose.
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    name: Deploy to GitHub Pages

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Still node20, and there is no newer major. GitHub owns this action and
      # will migrate it before the runners drop node20 in September 2026, so
      # the deprecation notice it prints is theirs to clear, not ours.
      - id: deployment
        uses: actions/deploy-pages@v4
