name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Without this matrix, "filament/filament: ^3.0 || ^4.0 || ^5.0" in
    # composer.json is an aspiration rather than a guarantee. Every row here
    # is a version combination the package claims to support.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Filament 3 — the legacy component hierarchy: Tables\Actions\Action
          # for table rows, a static Page::$view, Forms\Form + Infolists\Infolist.
          - { php: '8.2', laravel: '^12.0', filament: '^3.0', testbench: '^10.0' }
          - { php: '8.3', laravel: '^12.0', filament: '^3.0', testbench: '^10.0' }

          # Filament 4 — Schemas, unified Actions, instance Page::$view.
          - { php: '8.2', laravel: '^12.0', filament: '^4.0', testbench: '^10.0' }
          - { php: '8.4', laravel: '^12.0', filament: '^4.0', testbench: '^10.0' }

          # Filament 5.
          - { php: '8.3', laravel: '^12.0', filament: '^5.0', testbench: '^10.0' }
          - { php: '8.4', laravel: '^12.0', filament: '^5.0', testbench: '^10.0' }

          # Laravel 11 is deliberately absent. Every 11.x release including the
          # final one (11.56.1) is affected by PKSA-mdq4-51ck-6kdq (CRLF
          # injection in the default email rule, fixed in 12.60.0), and Laravel
          # 11 is past its security-support window, so no patched 11.x will
          # ship. Composer 2.9 blocks advisory-affected packages by default, so
          # the whole line is uninstallable — see composer.json.

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Filament ${{ matrix.filament }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, gd, dom, fileinfo, imagick
          coverage: none

      - name: Install dependencies
        run: |
          composer require --no-interaction --no-update \
            "laravel/framework:${{ matrix.laravel }}" \
            "filament/filament:${{ matrix.filament }}"
          composer require --dev --no-interaction --no-update \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Report resolved versions
        run: composer show --direct

      # Fails the build if a resolved dependency carries a known advisory,
      # rather than letting it pass quietly. `composer update` already refuses
      # to install advisory-affected packages by default; this catches
      # advisories published after the lock was resolved.
      - name: Audit dependencies
        run: composer audit --abandoned=ignore

      # `vendor/bin/pest` alone is not enough to prove the suite ran.
      # A fatal inside PHPUnit's output buffer (TCPDF calling die(), a
      # TypeError in a C extension call) kills the runner mid-run, discards the
      # buffered message, and still exits 0 — every remaining test file is
      # silently skipped. Requiring the summary line, and the expected file
      # count, turns that back into a failure.
      - name: Run tests
        run: |
          set -o pipefail
          vendor/bin/pest | tee pest-output.txt

          if ! grep -qE '^ *Tests: ' pest-output.txt; then
            echo "::error::Pest exited without printing a summary — the runner died mid-run and tests were silently skipped."
            exit 1
          fi

          expected=$(find tests -name '*Test.php' -size +0 | wc -l | tr -d ' ')
          actual=$(grep -cE '^ +(PASS|FAIL)' pest-output.txt)
          echo "Test files expected: $expected, reported: $actual"

          if [ "$actual" -lt "$expected" ]; then
            echo "::error::Only $actual of $expected test files ran."
            exit 1
          fi

  placement:
    # The launcher's overlap avoidance runs in the browser, so the PHP matrix
    # above cannot see it. This executes the shipped code — extracted from the
    # Blade view at run time, so it cannot drift — against a simulated DOM.
    # Without it, a regression in where the floating button lands would only
    # ever surface as a host app's UI covering something.
    runs-on: ubuntu-latest

    name: Launcher placement (Node)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step: the test deliberately uses nothing but Node built-ins.
      - name: Run placement checks
        run: npm run test:js

# NOTE — deliberately no PHPStan or Pint job yet.
#
# Both tools currently fail on code that predates this workflow: `phpstan
# analyse src --level=5` reports ~129 errors (the package has no larastan, so
# every Eloquent magic property is flagged), and `pint --test` wants to
# reformat ~90 files. Adding either as a required check would make CI red on
# day one for reasons unrelated to any given change.
#
# To turn them on: run `composer format`, add larastan, work the PHPStan count
# to zero (or commit a baseline), then append the jobs.
