name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Without this matrix, "filament/filament: ^3.0 || ^4.0 || ^5.0" in
    # composer.json is an aspiration rather than a guarantee. Every row here
    # is a version combination the package claims to support.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Filament 3 — the legacy component hierarchy (Tables\Actions\Action,
          # static Page::$view, Forms\Form + Infolists\Infolist).
          - { php: '8.2', laravel: '^11.0', filament: '^3.0', testbench: '^9.0' }
          - { php: '8.3', laravel: '^11.0', filament: '^3.0', testbench: '^9.0' }

          # Filament 4 — Schemas, unified Actions, instance Page::$view.
          - { php: '8.2', laravel: '^11.0', filament: '^4.0', testbench: '^9.0' }
          - { php: '8.3', laravel: '^12.0', filament: '^4.0', testbench: '^10.0' }
          - { php: '8.4', laravel: '^12.0', filament: '^4.0', testbench: '^10.0' }

          # Filament 5.
          - { php: '8.3', laravel: '^12.0', filament: '^5.0', testbench: '^10.0' }
          - { php: '8.4', laravel: '^12.0', filament: '^5.0', testbench: '^10.0' }

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Filament ${{ matrix.filament }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, gd, dom, fileinfo, imagick
          coverage: none

      - name: Install dependencies
        run: |
          composer require --no-interaction --no-update \
            "laravel/framework:${{ matrix.laravel }}" \
            "filament/filament:${{ matrix.filament }}"
          composer require --dev --no-interaction --no-update \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Report resolved versions
        run: |
          composer show filament/filament laravel/framework | grep -E "^versions|^name" || true

      - name: Run tests
        run: vendor/bin/pest

# NOTE — deliberately no PHPStan or Pint job yet.
#
# Both tools currently fail on code that predates this workflow: `phpstan
# analyse src --level=5` reports ~129 errors (the package has no larastan, so
# every Eloquent magic property is flagged), and `pint --test` wants to
# reformat ~90 files. Adding either as a required check would make CI red on
# day one for reasons unrelated to any given change.
#
# To turn them on: run `composer format`, add larastan, work the PHPStan count
# to zero (or commit a baseline), then append the jobs.
